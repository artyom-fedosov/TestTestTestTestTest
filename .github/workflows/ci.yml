name: ci

on:
  push:
    branches: ['**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  AppImage:
    name: AppImage-${{ matrix.build_type }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build_type: [Release, Debug]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            qt_arch: linux_gcc_64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: 6.8.1
          cache: true
